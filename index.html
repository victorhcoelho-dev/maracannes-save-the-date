<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MARACANNES · Save the Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Red+Hat+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#fdcd1d;
  --black:#000000;
  --white:#ffffff;
  --red:#d42b2b;
  --font-title:"Bebas Neue",sans-serif;
  --font-text:"Red Hat Display",sans-serif;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --px:50%; --py:38%;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:var(--black);color:var(--white)}
body{
  font-family:var(--font-text);
  min-height:100%;
  min-height:100svh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

.stage{
  position:relative;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:clamp(28px,6vh,56px) 24px;
  background:
    radial-gradient(560px circle at var(--px) var(--py),rgba(253,205,29,.10),transparent 68%),
    radial-gradient(900px 480px at 50% 100%,rgba(212,43,43,.16),transparent 72%),
    var(--black);
}

.spot{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.spot::before{
  content:"";position:absolute;top:0;left:50%;width:min(70vw,900px);height:100%;
  transform:translateX(-50%);
  background:radial-gradient(ellipse 55% 42% at 50% 0%,rgba(253,205,29,.16),transparent 68%);
}

.content{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
}

.logo{
  width:clamp(96px,15vw,150px);
  height:auto;
  margin-bottom:clamp(18px,3.4vh,30px);
  filter:drop-shadow(0 0 18px rgba(253,205,29,.35));
  opacity:0;
  animation:rise .8s ease-out .15s forwards;
}

.eyebrow{
  font-family:var(--font-text);
  font-weight:500;
  font-size:clamp(.72rem,1.5vw,.92rem);
  letter-spacing:.38em;
  text-indent:.38em;
  color:rgba(255,255,255,.55);
  margin:0 0 clamp(10px,2.2vh,18px);
  opacity:0;
  animation:rise .8s ease-out .3s forwards;
}

h1{
  font-family:var(--font-title);
  font-weight:400;
  font-size:clamp(3rem,13vw,8.5rem);
  line-height:.92;
  letter-spacing:.03em;
  margin:0;
  color:var(--white);
  opacity:0;
  animation:rise .9s ease-out .45s forwards;
}
h1 span{color:var(--yellow)}

.rule{
  width:56px;height:3px;background:var(--red);margin:clamp(14px,2.6vh,22px) 0;
  opacity:0;animation:grow .7s ease-out .8s forwards;
}
@keyframes grow{from{width:0;opacity:0}to{width:56px;opacity:1}}

h2{
  font-family:var(--font-title);
  font-weight:400;
  font-size:clamp(1.6rem,5.6vw,3.1rem);
  letter-spacing:.08em;
  margin:0 0 clamp(6px,1.4vh,10px);
  color:var(--yellow);
  opacity:0;
  animation:rise .8s ease-out .65s forwards;
}

.tag{
  font-family:var(--font-text);
  font-style:italic;
  font-size:clamp(.95rem,2.2vw,1.2rem);
  color:rgba(255,255,255,.68);
  max-width:32ch;
  margin:0 0 clamp(26px,5vh,44px);
  opacity:0;
  animation:rise .8s ease-out .95s forwards;
}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.count{
  display:flex;gap:clamp(10px,2.4vw,22px);
  opacity:0;animation:rise .8s ease-out 1.1s forwards;
}
.cell{
  min-width:clamp(58px,14vw,88px);
  padding:clamp(10px,1.8vh,16px) 4px;
  border:1px solid rgba(253,205,29,.4);
  border-radius:2px;
  background:rgba(255,255,255,.02);
}
.cell b{
  display:block;font-family:var(--font-title);font-weight:400;
  font-size:clamp(1.9rem,7vw,3.2rem);line-height:1;color:var(--yellow);
  font-variant-numeric:tabular-nums;
}
.cell b.tick{animation:tick .4s ease}
@keyframes tick{0%{transform:translateY(-6px);opacity:.25}100%{transform:translateY(0);opacity:1}}
.cell span{
  display:block;margin-top:5px;font-size:.68rem;letter-spacing:.1em;
  color:rgba(255,255,255,.5);text-transform:uppercase;
}

.today{
  display:none;font-family:var(--font-title);font-size:clamp(2.2rem,8vw,4rem);
  color:var(--yellow);letter-spacing:.05em;
}

.date{
  margin-top:clamp(28px,5.5vh,44px);
  font-family:var(--font-title);
  font-size:clamp(1.5rem,4.4vw,2.3rem);
  letter-spacing:.16em;
  color:rgba(255,255,255,.85);
  opacity:0;animation:rise .8s ease-out 1.3s forwards;
}
.date b{color:var(--red)}

.venue{
  margin-top:clamp(6px,1.4vh,10px);
  font-family:var(--font-text);
  font-weight:500;
  font-size:clamp(.82rem,2vw,1rem);
  letter-spacing:.1em;
  text-transform:uppercase;
  color:rgba(255,255,255,.5);
  opacity:0;animation:rise .8s ease-out 1.45s forwards;
}

@media (max-width:640px){
  .stage{padding:clamp(36px,8vh,64px) 22px}
  .logo{margin-bottom:clamp(22px,4.5vh,34px)}
  .eyebrow{margin-bottom:clamp(16px,3.4vh,24px)}
  h1{margin-bottom:clamp(4px,1vh,8px)}
  .rule{margin:clamp(18px,3.6vh,28px) 0}
  h2{margin-bottom:clamp(10px,2vh,14px)}
  .tag{margin-bottom:clamp(34px,6.5vh,50px)}
  .count{gap:clamp(8px,3vw,14px)}
  .date{margin-top:clamp(34px,6.5vh,50px)}
  .venue{margin-bottom:clamp(6px,1vh,10px)}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .logo,.eyebrow,h1,.rule,h2,.tag,.count,.date{opacity:1!important;transform:none!important}
}
</style>
</head>

  const t=performance.now()/1000;
  for(const p of dust){
    p.y+=p.vy; if(p.y<-4){p.y=H+4;p.x=Math.random()*W;}
    ctx.globalAlpha=.18+.42*Math.abs(Math.sin(t*1.1+p.ph));
    ctx.fillStyle='#fdcd1d';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
  }
  requestAnimationFrame(loop);
}
if(!reduce) loop();
</script>
